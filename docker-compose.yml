version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fnr_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: automation_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: fnr_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - ./api/.env
    volumes:
      # Persist the Playwright session directory to avoid needing to login to Facebook repeatedly
      - fb_session_data:/app/fb_session

volumes:
  pgdata:
  fb_session_data:
